[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cgdpd-fit"
version = "0.5.0"
description = "Fit bonded DPD / mDPD parameters to all-atom LAMMPS or GROMACS simulations (Boltzmann inversion + Swarm-CG style PSO)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hakan" }]
keywords = ["LAMMPS", "GROMACS", "DPD", "mDPD", "coarse-grained", "Boltzmann inversion", "Swarm-CG", "PSO"]
dependencies = ["numpy>=1.23", "scipy>=1.9", "matplotlib>=3.6", "PySide6>=6.5", "MDAnalysis>=2.0"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Environment :: X11 Applications :: Qt",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/erroshakan1/DPD-Bonded-Fitter"
Issues = "https://github.com/erroshakan1/DPD-Bonded-Fitter/issues"

[project.scripts]
cgdpd-fit = "cgdpd_fit.cli:entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cgdpd_fit = ["gui/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
